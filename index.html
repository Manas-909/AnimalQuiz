<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="screen active" id="start-screen">
            <h1>Animal Quiz Time!</h1>
            <p>Test your knowledge about these amazing animals and get to know some crazy facts about them.</p>
            <div class="quiz-categories">
                <button class="category-card" id="mammal-card">
                    <img src="assets/dog.png" alt="Mammals">
                    <h3>Mammals</h3>
                </button>
                <button class="category-card" id="fish-card">
                    <img src="assets/fish.svg" alt="Fishes">
                    <h3>Fishes</h3>
                </button>
            </div>
        </div>

        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span> of <span id="total-questions">5</span>
                    </p>

                    <p>
                        Score: <span id="score">0</span>
                    </p>
                </div>
            </div>

            <div id="answers-container" class="answers-container">

            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>

            <div id="fact-container" class="fact-container">
                <h3>Did you know?</h3>
                <p id="fact-text">fact</p>
                <button id="next-btn">Next Question</button>
                <small id="fact-source">source</small>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h1>Quiz Result</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>

                <div id="result-message">You scored better than 99%</div>
            </div>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
